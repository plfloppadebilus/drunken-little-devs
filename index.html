<!DOCTYPE html>
<html>
<head>
    <title>Drunken Little Devs</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: black;
            color: white;
            text-align: center;
            overflow: hidden;
        }

        #intro {
            position: fixed;
            width: 100%;
            height: 100%;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 999;
            cursor: pointer;
        }

        #intro h1 {
            font-size: 60px;
            color: red;
            animation: glow 1s infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px red; }
            to { text-shadow: 0 0 30px red; }
        }

        #main {
            display: none;
            background: radial-gradient(circle, #200000, #000000);
            height: 100vh;
        }

        .flag {
            font-size: 120px;
            color: red;
            margin-top: 20px;
        }

        .box {
            background: rgba(30,0,0,0.9);
            padding: 40px;
            margin: 20px auto;
            width: 60%;
            border-radius: 20px;
            box-shadow: 0 0 50px red;
        }

        .btn {
            padding: 12px 25px;
            background: red;
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
        }

        .btn:hover {
            background: darkred;
        }

        #bar {
            width: 0%;
            height: 20px;
            background: red;
            margin-top: 10px;
        }

        #release {
            position: fixed;
            width: 100%;
            height: 100%;
            background: black;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        #releaseText {
            font-size: 70px;
            color: red;
            animation: boom 2s forwards;
        }

        @keyframes boom {
            0% { opacity:0; transform:scale(0.5);}
            50% { opacity:1; transform:scale(1.3);}
            100% { transform:scale(1);}
        }
    </style>
</head>

<body>

<div id="intro">
    <h1>☭ Drunken Little Devs ☭</h1>
    <p>Kliknij aby rozpocząć</p>
</div>

<audio id="bg-music" loop>
    <source src="music.mp3">
</audio>

<div id="main">

    <!-- ☭ NA GÓRZE -->
    <div class="flag">☭</div>

    <div class="box">
        <h2>My First Communism</h2>

        <button class="btn" onclick="toggleMusic()">⏸ Music</button>
        <br><br>

        <button class="btn" id="downloadBtn" onclick="downloadGame()" disabled>🔒 Locked</button>
        <div id="bar"></div>

        <h2 id="countdown"></h2>

        <h3>📥 Downloads: <span id="downloads">0</span></h3>
    </div>
</div>

<div id="release">
    <h1 id="releaseText">☭ GAME IS OUT ☭</h1>
</div>

<script>
let music = document.getElementById("bg-music");

// intro
document.getElementById("intro").onclick = () => {
    document.getElementById("intro").style.display = "none";
    document.getElementById("main").style.display = "block";
    music.play().catch(()=>{});
}

// toggle music
function toggleMusic() {
    music.paused ? music.play() : music.pause();
}

// 📥 licznik (lokalny)
let downloads = localStorage.getItem("downloads") || 0;
document.getElementById("downloads").innerText = downloads;

// download
function downloadGame() {
    const target = new Date("May 2, 2026 16:00:00").getTime();
    const now = new Date().getTime();

    if (now < target) {
        alert("Game Will Be Available On 2nd May 4PM ☭");
        return;
    }

    let bar = document.getElementById("bar");
    let progress = 0;

    let interval = setInterval(() => {
        progress += 5;
        bar.style.width = progress + "%";

        if (progress >= 100) {
            clearInterval(interval);

            // zwiększ licznik
            downloads++;
            localStorage.setItem("downloads", downloads);
            document.getElementById("downloads").innerText = downloads;

            // download
            window.location.href = "setup.exe";
        }
    }, 200);
}

// countdown + unlock
function updateCountdown() {
    const target = new Date("May 2, 2026 16:00:00").getTime();
    const now = new Date().getTime();
    const diff = target - now;

    let btn = document.getElementById("downloadBtn");

    if (diff <= 0) {
        document.getElementById("countdown").innerText = "🔥 GAME IS OUT!";
        btn.disabled = false;
        btn.innerText = "⬇ Download";

        document.getElementById("release").style.display = "flex";
        return;
    }

    let d = Math.floor(diff / (1000*60*60*24));
    let h = Math.floor((diff%(1000*60*60*24))/(1000*60*60));
    let m = Math.floor((diff%(1000*60*60))/(1000*60));
    let s = Math.floor((diff%(1000*60))/1000);

    document.getElementById("countdown").innerText =
        `⏳ ${d}d ${h}h ${m}m ${s}s`;

    btn.disabled = true;
}

setInterval(updateCountdown, 1000);
updateCountdown();
</script>

</body>
</html>
