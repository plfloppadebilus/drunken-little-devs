<!DOCTYPE html>
<html>
<head>
    <title>Drunken Little Devs</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(-45deg, #000000, #2b0000, #000000, #3a0000);
            background-size: 400% 400%;
            animation: bgMove 10s infinite;
            color: white;
            text-align: center;
        }

        @keyframes bgMove {
            0% { background-position: 0% }
            50% { background-position: 100% }
            100% { background-position: 0% }
        }

        .box {
            background: rgba(20, 0, 0, 0.8);
            padding: 50px;
            margin: 80px auto;
            width: 60%;
            border-radius: 25px;
            box-shadow: 0 0 40px red;
        }

        h1 {
            font-size: 50px;
            color: #ff3c3c;
        }

        .btn {
            margin-top: 10px;
            padding: 12px 25px;
            background: red;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:hover {
            background: #ff5555;
        }

        #bar {
            width: 0%;
            height: 20px;
            background: red;
            margin-top: 10px;
        }

        .footer {
            margin-top: 100px;
            opacity: 0.6;
            font-size: 14px;
        }
    </style>
</head>

<body>

<!-- 🔊 AUDIO -->
<audio id="bg-music" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="box">
    <h1>🍺 Drunken Little Devs</h1>
    <p>My First Communism 🔥</p>

    <!-- 🎵 MUZYKA -->
    <button class="btn" onclick="startMusic()">▶ Start Music</button>
    <button class="btn" onclick="toggleMusic()">⏸ Pause / Resume</button>

    <br><br>

    <!-- 🎮 DOWNLOAD -->
    <button class="btn" onclick="fakeDownload()">⬇ Download Game</button>
    <div id="bar"></div>

    <br><br>

    <!-- 💬 DISCORD -->
    <a href="https://discord.gg/TjzUzgvy" target="_blank">
        <button class="btn">💬 Join Discord</button>
    </a>
</div>

<!-- 👤 CREDITS -->
<div class="footer">
    Created by <b>FloppaDev</b> 🍻
</div>

<!-- 🧠 SCRIPT -->
<script>
function startMusic() {
    let music = document.getElementById("bg-music");
    music.play().catch(() => {
        alert("Kliknij jeszcze raz 😄");
    });
}

function toggleMusic() {
    let music = document.getElementById("bg-music");
    if (music.paused) {
        music.play();
    } else {
        music.pause();
    }
}

function fakeDownload() {
    let bar = document.getElementById("bar");
    let progress = 0;

    let interval = setInterval(function() {
        progress += 5;
        bar.style.width = progress + "%";

        if (progress >= 100) {
            clearInterval(interval);
            alert("Game not ready yet 💀");
        }
    }, 200);
}
</script>

</body>
</html>
