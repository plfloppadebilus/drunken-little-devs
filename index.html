<!DOCTYPE html>
<html>
<head>
    <title>Drunken Little Devs</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: black;
            color: white;
            text-align: center;
            overflow: hidden;
        }

        #intro {
            position: fixed;
            width: 100%;
            height: 100%;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 999;
            cursor: pointer;
        }

        #intro h1 {
            font-size: 60px;
            color: red;
            animation: glow 1s infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px red; }
            to { text-shadow: 0 0 30px red; }
        }

        #main {
            display: none;
            background: radial-gradient(circle, #200000, #000000);
            height: 100vh;
        }

        .flag {
            font-size: 120px;
            color: red;
            margin-top: 20px;
        }

        .box {
            background: rgba(30,0,0,0.9);
            padding: 40px;
            margin: 20px auto;
            width: 60%;
            border-radius: 20px;
            box-shadow: 0 0 50px red;
        }

        .btn {
            padding: 12px 25px;
            background: red;
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            margin: 10px;
        }

        .btn:hover {
            background: darkred;
        }

        #bar {
            width: 0%;
            height: 20px;
            background: red;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div id="intro">
    <h1>☭ Drunken Little Devs ☭</h1>
    <p>Kliknij aby rozpocząć</p>
</div>

<audio id="bg-music" loop>
    <source src="music.mp3">
</audio>

<div id="main">

    <div class="flag">☭</div>

    <div class="box">
        <h2>My First Communism</h2>

        <button class="btn" onclick="toggleMusic()">⏸ Music</button>

        <br><br>

        <button class="btn" onclick="downloadGame()">⬇ Download</button>

        <div id="bar"></div>
    </div>
</div>

<script>
let music = document.getElementById("bg-music");

// intro
document.getElementById("intro").onclick = () => {
    document.getElementById("intro").style.display = "none";
    document.getElementById("main").style.display = "block";
    music.play().catch(()=>{});
}

// music
function toggleMusic() {
    music.paused ? music.play() : music.pause();
}

// download (bez blokad)
function downloadGame() {
    let bar = document.getElementById("bar");
    let progress = 0;

    let interval = setInterval(() => {
        progress += 5;
        bar.style.width = progress + "%";

        if (progress >= 100) {
            clearInterval(interval);
            window.location.href = "https://github.com/plfloppadebilus/drunken-little-devs/releases/tag/GAME!!!";
        }
    }, 200);
}
</script>

</body>
</html>
