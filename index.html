<!DOCTYPE html>
<html>
<head>
    <title>Drunken Little Devs</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: black;
            color: white;
            text-align: center;
            overflow: hidden;
        }

        #intro {
            position: fixed;
            width: 100%;
            height: 100%;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 999;
            cursor: pointer;
        }

        #intro h1 {
            font-size: 60px;
            color: red;
            animation: glow 1s infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px red; }
            to { text-shadow: 0 0 30px red; }
        }

        #main {
            display: none;
            background: radial-gradient(circle, #200000, #000000);
            height: 100vh;
        }

        .flag {
            font-size: 120px;
            color: red;
            margin-top: 20px;
        }

        .box {
            background: rgba(30,0,0,0.9);
            padding: 40px;
            margin: 20px auto;
            width: 60%;
            border-radius: 20px;
            box-shadow: 0 0 50px red;
        }

        .btn {
            padding: 12px 25px;
            background: red;
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            font-size:16px;
        }

        .btn:hover {
            background: darkred;
        }

        select {
            padding:12px;
            border-radius:10px;
            background:black;
            color:white;
            border:2px solid red;
        }

        #bar {
            width: 0%;
            height: 20px;
            background: red;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div id="intro">
    <h1>☭ Drunken Little Devs ☭</h1>
    <p>Kliknij aby rozpocząć</p>
</div>

<audio id="bg-music" loop>
    <source src="music.mp3">
</audio>

<div id="main">

    <div class="flag">☭</div>

    <div class="box">
        <h2>My First Communism</h2>

        <button class="btn" onclick="toggleMusic()">⏸ Music</button>

        <br><br>

        <select id="versionSelect">
            <option value="v0.1">v0.1 Stable</option>
            <option value="v0.2">v0.1 Collab1</option>
            <option value="beta">not now</option>
        </select>

        <br><br>

        <button class="btn" onclick="downloadGame()">
            ⬇ Download
        </button>

        <div id="bar"></div>

        <h3>📥 Downloads: <span id="downloads">0</span></h3>
    </div>

</div>

<script>

let music = document.getElementById("bg-music");

document.getElementById("intro").onclick = () => {
    document.getElementById("intro").style.display = "none";
    document.getElementById("main").style.display = "block";
    music.play().catch(()=>{});
};

function toggleMusic() {
    music.paused ? music.play() : music.pause();
}

let downloads = localStorage.getItem("downloads") || 0;
document.getElementById("downloads").innerText = downloads;

const links = {
    "v0.1":"https://github.com/plfloppadebilus/drunken-little-devs/releases/tag/v1.0.0",
    "v0.2":"TU_LINK_V0.2",
    "beta":"TU_LINK_BETA"
};

function downloadGame() {

    const version =
        document.getElementById("versionSelect").value;

    let bar = document.getElementById("bar");
    let progress = 0;

    let interval = setInterval(() => {

        progress += 5;
        bar.style.width = progress + "%";

        if(progress >= 100){

            clearInterval(interval);

            downloads++;
            localStorage.setItem("downloads",downloads);

            document.getElementById("downloads").innerText = downloads;

            window.location.href = links[version];
        }

    },200);
}

</script>

</body>
</html>
