<!DOCTYPE html>
<html>
<head>
    <title>Drunken Little Devs</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: black;
            color: white;
            text-align: center;
            overflow: hidden;
        }

        /* 🎬 INTRO */
        #intro {
            position: fixed;
            width: 100%;
            height: 100%;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 999;
            cursor: pointer;
        }

        #intro h1 {
            font-size: 60px;
            color: red;
            animation: glow 1s infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px red; }
            to { text-shadow: 0 0 30px red; }
        }

        /* 🎮 MAIN */
        #main {
            display: none;
            background: radial-gradient(circle, #200000, #000000);
            height: 100vh;
            overflow: auto;
        }

        .flag {
            font-size: 120px;
            color: red;
        }

        .box {
            background: rgba(30, 0, 0, 0.9);
            padding: 40px;
            margin: 40px auto;
            width: 60%;
            border-radius: 20px;
            box-shadow: 0 0 50px red;
        }

        h2 {
            color: red;
        }

        .btn {
            margin-top: 10px;
            padding: 12px 25px;
            background: red;
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
        }

        .btn:hover {
            background: darkred;
        }

        #bar {
            width: 0%;
            height: 20px;
            background: red;
            margin-top: 10px;
        }

        .footer {
            margin-top: 50px;
            opacity: 0.6;
        }
    </style>
</head>

<body>

<!-- 🎬 INTRO -->
<div id="intro">
    <h1>☭ Drunken Little Devs ☭</h1>
    <p>Kliknij aby rozpocząć</p>
</div>

<!-- 🔊 AUDIO -->
<audio id="bg-music" loop preload="auto">
    <source src="./music.mp3" type="audio/mpeg">
</audio>

<!-- 🎮 MAIN -->
<div id="main">
    <div class="flag">☭</div>

    <div class="box">
        <h2>My First Communism</h2>

        <button class="btn" onclick="toggleMusic()">⏸ Music</button>

        <br><br>

        <button class="btn" onclick="fakeDownload()">⬇ Download</button>
        <div id="bar"></div>

        <br><br>

        <a href="https://discord.gg/TWOJ_LINK" target="_blank">
            <button class="btn">💬 Discord</button>
        </a>
    </div>

    <div class="footer">
        Created by <b>FloppaDev</b> ☭
    </div>
</div>

<script>
let music = document.getElementById("bg-music");

// 🎬 START (TO JEST KLUCZ DO AUDIO)
document.getElementById("intro").addEventListener("click", function () {
    document.getElementById("intro").style.display = "none";
    document.getElementById("main").style.display = "block";

    music.muted = false;
    music.volume = 1;

    let playPromise = music.play();

    if (playPromise !== undefined) {
        playPromise.catch(() => {
            alert("Kliknij jeszcze raz 😄");
        });
    }
});

// ⏸ toggle
function toggleMusic() {
    if (music.paused) {
        music.play();
    } else {
        music.pause();
    }
}

// 🎮 fake download
function fakeDownload() {
    let bar = document.getElementById("bar");
    let progress = 0;

    let interval = setInterval(() => {
        progress += 5;
        bar.style.width = progress + "%";

        if (progress >= 100) {
            clearInterval(interval);
            alert("Game not ready yet ☭");
        }
    }, 200);
}
</script>

</body>
</html>
