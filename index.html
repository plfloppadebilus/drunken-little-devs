<!DOCTYPE html>

            color: white;
            font-family: Arial;

        }

        h1 {
            font-size: 50px;
            margin-top: 40px;
        }

        p {
            font-size: 20px;
        }

        }

        button {
            background-color: red;

            font-size: 18px;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
            transition: 0.3s;
        }

        button:hover {
            background-color: darkred;
            transform: scale(1.1);
        }

        img {
            margin-top: 30px;
            border-radius: 15px;
            width: 400px;
        }

        .logo {
            font-size: 80px;
        }

</head>

<body>

    <div class="logo">☭</div>

    <img src="menu.png">

        <a href="#">

        </a>

</html>
