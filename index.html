<!DOCTYPE html>
<html>
<head>
    <title>Drunken Little Devs</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: black;
            color: white;
            text-align: center;
            overflow: hidden;
        }

        /* 🎬 INTRO */
        #intro {
            position: fixed;
            width: 100%;
            height: 100%;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 999;
            cursor: pointer;
        }

        #intro h1 {
            font-size: 60px;
            color: red;
            animation: glow 1s infinite alternate;
        }

        #intro p {
            opacity: 0.6;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px red; }
            to { text-shadow: 0 0 30px red; }
        }

        /* 🎮 MAIN */
        #main {
            display: none;
            background: radial-gradient(circle, #200000, #000000);
            height: 100vh;
            overflow: auto;
        }

        .flag {
            font-size: 120px;
            color: red;
            margin-top: 30px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .box {
            background: rgba(30, 0, 0, 0.9);
            padding: 40px;
            margin: 40px auto;
            width: 60%;
            border-radius: 20px;
            box-shadow: 0 0 50px red;
        }

        h2 {
            color: red;
        }

        .btn {
            margin-top: 10px;
            padding: 12px 25px;
            background: red;
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            background: darkred;
            transform: scale(1.1);
        }

        #bar {
            width: 0%;
            height: 20px;
            background: red;
            margin-top: 10px;
        }

        .footer {
            margin-top: 50px;
            opacity: 0.6;
        }
    </style>
</head>

<body>

<!-- 🎬 INTRO -->
<div id="intro">
    <h1>☭ Drunken Little Devs ☭</h1>
    <p>Click to start</p>
</div>

<!-- 🔊 AUDIO -->
<audio id="bg-music" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- 🎮 MAIN MENU -->
<div id="main">
    <div class="flag">☭</div>

    <div class="box">
        <h2>My First Communism</h2>

        <button class="btn" onclick="toggleMusic()">⏸ Music</button>

        <br><br>

        <button class="btn" onclick="fakeDownload()">⬇ Download Game</button>
        <div id="bar"></div>

        <br><br>

        <a href="https://discord.gg/TWOJ_LINK" target="_blank">
            <button class="btn">💬 Join Discord</button>
        </a>
    </div>

    <div class="footer">
        Created by <b>FloppaDev</b> ☭
    </div>
</div>

<script>
let music = document.getElementById("bg-music");

// 🎬 START GRY (intro → menu)
document.getElementById("intro").addEventListener("click", function() {
    document.getElementById("intro").style.display = "none";
    document.getElementById("main").style.display = "block";

    // 🔊 muzyka startuje (działa bo klik)
    music.play();
});

// ⏸ pauza/wznów
function toggleMusic() {
    if (music.paused) {
        music.play();
    } else {
        music.pause();
    }
}

// 🎮 fake download
function fakeDownload() {
    let bar = document.getElementById("bar");
    let progress = 0;

    let interval = setInterval(() => {
        progress += 5;
        bar.style.width = progress + "%";

        if (progress >= 100) {
            clearInterval(interval);
            alert("Game not ready yet ☭");
        }
    }, 200);
}
</script>

</body>
</html>
