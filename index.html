<!DOCTYPE html>
<html>
<head>
    <title>Drunken Little Devs</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a0000, #660000);
            color: white;
            text-align: center;
        }

        .container {
            margin-top: 100px;
        }

        h1 {
            font-size: 50px;
            margin-bottom: 10px;
        }

        p {
            font-size: 20px;
            opacity: 0.8;
        }

        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 30px;
            font-size: 18px;
            color: white;
            background: #ff0000;
            border: none;
            border-radius: 10px;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn:hover {
            background: #cc0000;
            transform: scale(1.1);
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Drunken Little Devs 🍻</h1>
    <p>My First Communism 🔥</p>

    <a class="btn" href="#">Play Game</a>
</div>

</body>
</html>
